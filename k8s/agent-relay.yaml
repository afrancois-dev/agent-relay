# Agent Relay API. The Deployment keeps the requested replica count running and
# rolls out image updates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  namespace: agent-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-relay
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      initContainers:
        # Kubernetes has no `depends_on`; wait until PostgreSQL accepts
        # connections before starting the API.
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U relay -d agentrelay; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: agent-relay
          image: agent-relay:local
          # The image is side-loaded into kind, so never try to pull it.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RELAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
          # /ready queries the real tables, so it only passes once the schema is
          # present in PostgreSQL.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-relay
  namespace: agent-relay
spec:
  selector:
    app: agent-relay
  ports:
    - name: http
      port: 8000
      targetPort: http
