global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: agent-relay

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Metrics arrive through the OpenTelemetry Collector, not by scraping the app.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
