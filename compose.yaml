services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: agentrelay
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates a scratch database for the integration tests so a test run
      # never drops the tables the running API is using.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d agentrelay"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    image: agent-relay:local
    environment:
      # `postgres` is the Compose service name, resolvable on the stack's
      # network. The `+psycopg` dialect selects the installed psycopg 3 driver.
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/agentrelay
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Integration tests: same image, real HTTP API and real PostgreSQL.
  # Run explicitly with `docker compose run --rm test`.
  test:
    build: .
    image: agent-relay:local
    profiles: ["test"]
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/agentrelay_test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./test_agent_relay.py:/app/test_agent_relay.py:ro
    command: [".venv/bin/pytest", "-q", "test_agent_relay.py"]

volumes:
  postgres-data:
